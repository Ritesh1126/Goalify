<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goalify</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

</head>
<body>
    
    <div id="main">  
       <nav>

       </nav>

       <section class="container">

        <div class="box" id="todo" >
            <img src="to do.jpeg" alt="">
            <span>To Do List</span>
        </div>

        <div class= "box" id="Goals" >
            <img src="planner.jpeg" alt="">
            <span>Goals</span>
        </div>

        <div class= "box" id="Motivational" >
            <img src="motivational image.jpeg" alt="">
            <span>Motivational</span> 
        </div>

        <div class="box" id="Fitness" >
            <img src="fitness.jpeg" alt="">
            <span>Fitness</span>
        </div>

        <div class="box" id="Timer" >
            <img src="timer.jpeg" alt="">
            <span>Timer</span>
        </div>

       </section>

       <section class="fullbox todo-fullpage" id="5" >
        <button class="back" id="0"><i class="ri-close-circle-line"></i></button>
        <h1>To do</h1>
        <div class="Todo-container">
            <div class="addtask">
                <form class="form">
                    <h2>Add Task</h2>
                    <input type="text" placeholder="Enter Task">
                    <textarea placeholder="Enter Details" name="" id="" cols="30" rows="30"></textarea>
                    <div class="important-check">
                        <input type="checkbox" id="important">
                        <label for="important">Mark as important</label>
                    </div>
                    <button type="submit">Add Task</button>
                </form>
            </div>
            <div class="alltask">
                <div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div>
                <div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div>
                <div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div><div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div><div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div><div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div><div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div><div class="task">
                    <h2> Go To GYM </h2>
                    <button>Mark As Done</button>
                </div>
            </div>
        </div>
       </section>

       <section class="fullbox Goals-fullpage" id="10" >
        <button class="back" id="1"><i class="ri-close-circle-line"></i></button>
        <h1>Goals</h1>
       </section>

         <section class="fullbox Motivational-fullpage" id="20" >
        <button class="back" id="2"><i class="ri-close-circle-line"></i></button>
        <h1>Motivational</h1>
       </section>

         <section class="fullbox Fitness-fullpage" id="30">
        <button class="back" id="3"><i class="ri-close-circle-line"></i></button>
        <h1>Fitness</h1>
       </section>

         <section class="fullbox Timer-fullpage" id="40" >
        <button class="back" id="4"><i class="ri-close-circle-line"></i></button>
        <h1>Timer</h1>
       </section> 
       
    </div>

    
    <script src="script.js"></script>

</body>
</html>
